name: Build Android APK with Robot Modification

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Blender 4.1
        run: |
          wget -q https://download.blender.org/release/Blender4.1/blender-4.1.0-linux-x64.tar.xz
          tar -xf blender-4.1.0-linux-x64.tar.xz
          mv blender-4.1.0-linux-x64 /opt/blender
          echo "/opt/blender" >> $GITHUB_PATH

      - name: Run Blender to modify robot
        run: |
          /opt/blender/blender --background --python scripts/modify_robot.py

      - name: Upload modified robot artifact
        uses: actions/upload-artifact@v4
        with:
          name: robot_k4000
          path: assets/robot_k4000.glb

      - name: Download Godot 4.2 stable
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_linux.x86_64.zip
          unzip Godot_v4.2-stable_linux.x86_64.zip
          mv Godot_v4.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Download export templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.2-stable/Godot_v4.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.2.stable
          unzip Godot_v4.2-stable_export_templates.tpz -d ~/.local/share/godot/export_templates/4.2.stable
          mv ~/.local/share/godot/export_templates/4.2.stable/templates/* ~/.local/share/godot/export_templates/4.2.stable/
          rm -rf ~/.local/share/godot/export_templates/4.2.stable/templates

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Export APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./godot --headless --export-debug "Android" "EchoLabSy.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EchoLabSy-APK
          path: EchoLabSy.apkname: Build Android APK with Robot Modification

